# =============================================================================
# 味禾小馆官网 —— CI/CD 工作流
# -----------------------------------------------------------------------------
# 触发：推送到 main 分支时自动执行。
# 流程：
#   1. test     ：后端依赖安装 + 语法/导入检查（项目暂无 pytest 用例，做可运行性校验）；
#                 前端/后台依赖安装 + 类型检查（tsc --noEmit / tsc -b）。
#   2. build    ：构建前端/后台静态产物，并用 docker compose 构建全部镜像。
#   3. deploy   ：把镜像/源码部署到服务器（rsync/ssh 占位，需填密钥后启用）。
#
# 需在使用前补充的 Secrets（仓库 Settings → Secrets → Actions）：
#   - 若部署用 SSH：SSH_HOST / SSH_USER / SSH_KEY
#   - SECRET_KEY / ALLOWED_ORIGINS 等（供 compose 变量替换，可选）
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  # ---------------------- 1. 测试 / 校验 ----------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 后端依赖安装 + 导入校验
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 项目暂无 pytest 用例，这里做“能否正常导入并启动”的冒烟校验
          python -c "import app.main; print('backend import OK')"

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 前台依赖安装 + 类型检查
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

      - name: 后台依赖安装 + 类型检查
        working-directory: admin
        run: |
          npm ci
          npx tsc -b

  # ---------------------- 2. 构建镜像 ----------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建全部服务镜像
        # 仅构建不推送；如需推送镜像仓库，可在此登录并 docker compose push
        run: docker compose build

  # ---------------------- 3. 部署到服务器（占位）----------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 默认不自动部署；取消下面这行注释并在 Secrets 配好 SSH 后启用
    # if: false
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 通过 SSH 部署（示例占位）
        # 取消注释并填入真实服务器信息后生效：
        # uses: appleboy/ssh-action@v1.0.3
        # with:
        #   host: ${{ secrets.SSH_HOST }}
        #   username: ${{ secrets.SSH_USER }}
        #   key: ${{ secrets.SSH_KEY }}
        #   script: |
        #     cd /opt/weihe
        #     git pull
        #     docker compose up -d --build
        run: echo "部署步骤占位：在 Secrets 配置 SSH 后启用上面的 ssh-action"
