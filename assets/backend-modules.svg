<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" width="100%">
  <title>味禾小馆官网后台系统模块图</title>
  <desc>FastAPI 后台系统分层模块：路由、业务逻辑、数据模型、外部依赖。</desc>
  <defs>
    <marker id="be-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 入口/公共层 -->
  <rect x="40" y="30" width="820" height="80" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="450" y="54" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">入口与公共层</text>
  <rect x="70" y="75" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="125" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">main.py</text>
  <rect x="200" y="75" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="255" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">config.py</text>
  <rect x="330" y="75" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="385" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">database.py</text>
  <rect x="460" y="75" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="515" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">CORS / 限流</text>
  <rect x="590" y="75" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="645" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">日志 / 异常</text>
  <rect x="720" y="75" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="775" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Health Check</text>

  <!-- 路由层 -->
  <rect x="40" y="140" width="820" height="140" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="450" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">路由层（Routers / API）</text>
  <rect x="70" y="185" width="80" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="110" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">公共</text>
  <text x="110" y="235" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">/public</text>

  <rect x="170" y="185" width="80" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="210" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">菜品</text>
  <text x="210" y="235" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">/dishes</text>

  <rect x="270" y="185" width="80" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="310" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">门店</text>
  <text x="310" y="235" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">/stores</text>

  <rect x="370" y="185" width="80" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="410" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">新闻</text>
  <text x="410" y="235" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">/news</text>

  <rect x="470" y="185" width="80" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="510" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">岗位</text>
  <text x="510" y="235" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">/jobs</text>

  <rect x="570" y="185" width="80" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="610" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">招商</text>
  <text x="610" y="235" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">/franchise</text>

  <rect x="670" y="185" width="80" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="710" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">联系</text>
  <text x="710" y="235" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">/contact</text>

  <rect x="770" y="185" width="80" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text x="810" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">管理</text>
  <text x="810" y="235" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">/admin</text>

  <!-- 业务逻辑层 -->
  <rect x="40" y="310" width="400" height="80" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="240" y="334" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">业务逻辑层（Services）</text>
  <rect x="70" y="355" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
  <text x="120" y="375" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">dish_service</text>
  <rect x="190" y="355" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
  <text x="240" y="375" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">news_service</text>
  <rect x="310" y="355" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
  <text x="360" y="375" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">email_service</text>

  <!-- 数据校验层 -->
  <rect x="460" y="310" width="400" height="80" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="660" y="334" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">数据校验层（Schemas）</text>
  <rect x="490" y="355" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
  <text x="545" y="375" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">Pydantic Models</text>
  <rect x="620" y="355" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
  <text x="675" y="375" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">Request / Response</text>

  <!-- 数据访问层 -->
  <rect x="40" y="420" width="820" height="80" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="450" y="444" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">数据访问层（Models / ORM）</text>
  <rect x="70" y="465" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="125" y="485" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">SQLAlchemy</text>
  <rect x="200" y="465" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="255" y="485" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Alembic 迁移</text>
  <rect x="330" y="465" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="385" y="485" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">10 张业务表</text>
  <rect x="460" y="465" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="515" y="485" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">配置表</text>
  <rect x="590" y="465" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="645" y="485" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">异步 Session</text>
  <rect x="720" y="465" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="775" y="485" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">连接池</text>

  <!-- 外部依赖 -->
  <rect x="40" y="530" width="820" height="70" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="450" y="554" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">外部依赖</text>
  <rect x="70" y="575" width="130" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="135" y="595" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">PostgreSQL</text>
  <rect x="220" y="575" width="130" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="285" y="595" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">对象存储 / 本地</text>
  <rect x="370" y="575" width="130" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="435" y="595" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">SMTP 邮件</text>
  <rect x="520" y="575" width="130" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="585" y="595" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Swagger / OpenAPI</text>
  <rect x="670" y="575" width="130" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="735" y="595" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Uvicorn / Gunicorn</text>

  <!-- 连接箭头 -->
  <line x1="450" y1="110" x2="450" y2="140" stroke="#5F5E5A" stroke-width="1" marker-end="url(#be-arrow)"/>
  <line x1="450" y1="280" x2="240" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#be-arrow)"/>
  <line x1="450" y1="280" x2="660" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#be-arrow)"/>
  <line x1="240" y1="390" x2="240" y2="420" stroke="#5F5E5A" stroke-width="1" marker-end="url(#be-arrow)"/>
  <line x1="660" y1="390" x2="660" y2="420" stroke="#5F5E5A" stroke-width="1" marker-end="url(#be-arrow)"/>
  <line x1="450" y1="500" x2="450" y2="530" stroke="#5F5E5A" stroke-width="1" marker-end="url(#be-arrow)"/>
</svg>