<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img" width="100%">
  <title>味禾小馆官网系统架构图</title>
  <desc>前后端分离架构：客户端、React 前端、FastAPI 后端、PostgreSQL 数据层。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 客户端层 -->
  <rect x="40" y="30" width="600" height="80" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="54" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">客户端</text>
  <rect x="80" y="68" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="140" y="86" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">浏览器</text>
  <rect x="280" y="68" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="86" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">微信 / 手机</text>
  <rect x="480" y="68" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="540" y="86" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#444441">搜索引擎爬虫</text>

  <!-- 连接箭头 1 -->
  <line x1="200" y1="86" x2="280" y2="86" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="400" y1="86" x2="480" y2="86" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="110" x2="340" y2="136" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 前端层 -->
  <rect x="40" y="136" width="600" height="100" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">前端层（React SPA）</text>
  <rect x="100" y="180" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="145" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#0C447C">Vite</text>
  <rect x="220" y="180" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="265" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#0C447C">React 18</text>
  <rect x="340" y="180" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="385" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#0C447C">Tailwind</text>
  <rect x="460" y="180" width="120" height="40" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="520" y="200" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#0C447C">Router + SWR</text>

  <!-- 连接箭头 2 -->
  <line x1="340" y1="236" x2="340" y2="260" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 后端层 -->
  <rect x="40" y="260" width="600" height="100" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="340" y="284" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">后端层（FastAPI）</text>
  <rect x="100" y="304" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="145" y="324" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">FastAPI</text>
  <rect x="220" y="304" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="265" y="324" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">Pydantic</text>
  <rect x="340" y="304" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="385" y="324" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">SQLAlchemy</text>
  <rect x="460" y="304" width="120" height="40" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="520" y="324" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">Alembic + Uvicorn</text>

  <!-- 连接箭头 3 -->
  <line x1="300" y1="360" x2="260" y2="392" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="380" y1="360" x2="420" y2="392" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 数据层 -->
  <rect x="40" y="392" width="600" height="60" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="340" y="412" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">数据层</text>
  <rect x="160" y="426" width="140" height="36" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
  <text x="230" y="444" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#633806">PostgreSQL 14+</text>
  <rect x="380" y="426" width="140" height="36" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
  <text x="450" y="444" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#633806">本地 / 对象存储</text>
</svg>