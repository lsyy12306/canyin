# =============================================================================
# 后台 Nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
# -----------------------------------------------------------------------------
# 职责与前台一致：托管 Ant Design 管理台静态站点 + 反代 /api、/uploads 到 backend。
# 后台在 docker-compose 内发布到 8080，因此浏览器访问 http://host:8080 即可，
# 所有接口仍由本容器 nginx 转发到 backend:8000，无需跨域直连。
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # ---- 反向代理：后端 API（含后台鉴权接口 /api/admin/*）----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 反向代理：上传的菜品图片 ----
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 静态资源长缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA 回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
