# Alembic 配置
# sqlalchemy.url 留空，由 app/migrations/env.py 从 app.config.settings 读取（环境变量可覆盖）。

[alembic]
script_location = app/migrations
prepend_sys_path = .
version_path_separator = os

# 数据库连接串在 env.py 中按 settings.DATABASE_URL 注入，此处留空。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
