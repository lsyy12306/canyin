# =============================================================================
# 前台 Nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
# -----------------------------------------------------------------------------
# 职责：
#   1. 托管 React 打包后的静态站点（/usr/share/nginx/html）；
#   2. SPA 路由回退：非文件请求统一返回 /index.html，交给前端路由处理；
#   3. 反向代理：/api 与 /uploads 转发到后端服务 backend:8000，
#      使浏览器只暴露 80 端口即可同时访问页面与接口（避免跨域直连后端）。
# 注意：backend 是 docker-compose 中的服务名，容器内 DNS 可解析。
# =============================================================================

server {
    listen 80;
    server_name _;

    # 站点根目录（React 构建产物）
    root /usr/share/nginx/html;
    index index.html;

    # 上传文件大小上限（预留，菜品图一般很小）
    client_max_body_size 10m;

    # ---- 反向代理：后端 API ----
    # 所有 /api/* 请求转发到 backend 容器 8000 端口
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 反向代理：上传的菜品图片等静态资源 ----
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 静态资源：带哈希文件名，可长缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA 回退 ----
    # 先尝试匹配真实文件（$uri），否则回退到 index.html 交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
